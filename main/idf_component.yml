## IDF Component Manager Manifest File
dependencies:
  lvgl/lvgl:
    version: "8.4.*"
    public: true
  waveshare/esp32_p4_wifi6_touch_lcd_7b:
    version: "^1.0.2"
    public: true
  espressif/esp_wifi_remote:
    version: "*"
  # Pinned EXACT: with "*" a dependency re-resolution (2026-08-01) silently
  # jumped esp_hosted 2.12.9 -> 3.0.5, whose rewritten SDIO bring-up fails
  # on this board's C6 slave (eh_sdio "card init failed" -> esp_wifi_init
  # aborts -> boot loop). 2.12.9 is the version validated on this hardware;
  # bump deliberately and retest SDIO bring-up + a long jog session before
  # trusting anything newer.
  espressif/esp_hosted:
    version: "==2.12.9"
  # Pinned EXACT: arrives transitively via the Waveshare BSP as "^2", and
  # dependencies.lock is not tracked, so a fresh clone resolves to the newest
  # 2.x. 2.9.0 assumes IDF 5.5 renamed the DPI panel callback
  # on_refresh_done -> on_frame_buf_complete; released 5.5.2 headers still use
  # on_refresh_done, so 2.9.0 fails to compile ("has no member named
  # 'on_frame_buf_complete'"). 2.8.0 uses on_refresh_done and builds.
  espressif/esp_lvgl_port:
    version: "==2.8.0"
